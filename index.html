import React, { useState, useMemo, useCallback, useEffect } from "react";
import {
  LineChart, Line, BarChart, Bar, XAxis, YAxis, ResponsiveContainer,
  Tooltip, PieChart, Pie, Cell, ReferenceArea,
} from "recharts";
import {
  Target, TrendingUp, Users, Activity, Gauge, BarChart3, Crosshair,
  Clock, FileEdit, UserCheck, DollarSign, Cog, Eye, ShieldCheck,
  RotateCcw, SlidersHorizontal, ChevronDown, Pencil, Check, X, Info, Star,
} from "lucide-react";
import { createRoot } from "react-dom/client";

/* ------------------------------------------------------------------ */
/*  BASELINE DATA  — 24-month window (Jun '22 → May '24).               */
/*  The five most recent months (Jan–May '24) are the validated         */
/*  snapshot figures; 19 months of history are back-cast onto them      */
/*  with a realistic growth trajectory so the 2-year trend tells a       */
/*  story. "All Disciplines / Jan–May '24" still reconciles to $96.4M.  */
/* ------------------------------------------------------------------ */

// Build 24 month labels ending May 2024.
const MONTH_ABBR = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function buildMonths() {
  const out = []; let y = 2022, m = 5; // start Jun 2022
  for (let k = 0; k < 24; k++) { out.push(`${MONTH_ABBR[m]} '${String(y).slice(2)}`); if (++m > 11) { m = 0; y++; } }
  return out;
}
const MONTHS = buildMonths();         // Jun '22 ... May '24  (length 24)
const YTD_START = 19;                 // index of Jan '24 (start of validated YTD)

// Validated recent tail (Jan–May 2024) — matches the source dashboard.
const RECENT = {
  billableHours:   [78400, 80100, 81600, 83200, 85100],
  availableHours:  [110000, 109500, 109000, 110200, 112000],
  netRevenue:      [17.9, 18.4, 19.2, 20.1, 20.8],
  headcount:       [402, 404, 406, 409, 413],
  directLaborCost: [5.78, 5.94, 6.10, 6.35, 6.55],
  directCosts:     [12.85, 13.10, 13.62, 14.30, 14.80],
  projectsWon:     [11, 9, 13, 12, 14],
  proposalsSub:    [27, 24, 29, 26, 31],
  wonValue:        [3.4, 2.9, 4.1, 3.8, 4.6],
  notWonValue:     [4.8, 5.1, 5.6, 5.0, 5.2],
  cycleTime:       [9.9, 9.7, 9.4, 9.3, 9.1],
  coFrequency:     [6.0, 6.1, 6.3, 6.0, 6.2],
  coValue:         [3.6, 3.7, 3.9, 3.6, 3.8],
  retained:        [448, 450, 452, 455, 456],
  turnover:        [40, 41, 42, 43, 44],
  burnBudget:      [88, 90, 92, 95, 96],
  burnProgress:    [90, 92, 94, 97, 99],
  backlogMonths:   [7.7, 7.9, 8.0, 8.1, 8.2],   // months of work secured (point-in-time stock)
};

// Deterministic PRNG (runs once at module load) so history is stable.
let _seed = 20240531 >>> 0;
const rnd = () => { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; };
const jit = (a) => 1 + (rnd() - 0.5) * 2 * a;        // multiplicative jitter
const jadd = (a) => (rnd() - 0.5) * 2 * a;            // additive jitter

const HIST = 19;                                     // months of back-cast history
// Per-series generation config. "mul" series back-cast with monthly growth g
// (firm grows ~1.2%/mo ≈ 15%/yr, consistent with the +12% YoY revenue).
// "add" series are rates that wander and gently improve toward the present.
const GEN = {
  billableHours:   { t: "mul", g: 1.012, n: 0.020, int: true },
  availableHours:  { t: "mul", g: 1.006, n: 0.010, int: true },
  netRevenue:      { t: "mul", g: 1.013, n: 0.022 },
  headcount:       { t: "mul", g: 1.007, n: 0.008, int: true },
  directLaborCost: { t: "mul", g: 1.012, n: 0.020 },
  directCosts:     { t: "mul", g: 1.012, n: 0.020 },
  projectsWon:     { t: "mul", g: 1.010, n: 0.10, int: true, min: 4 },
  proposalsSub:    { t: "mul", g: 1.008, n: 0.08, int: true, min: 9 },
  wonValue:        { t: "mul", g: 1.012, n: 0.06 },
  notWonValue:     { t: "mul", g: 1.006, n: 0.06 },
  retained:        { t: "mul", g: 1.007, n: 0.006, int: true },
  turnover:        { t: "mul", g: 1.004, n: 0.05, int: true, min: 20 },
  cycleTime:       { t: "add", slope: 0.090, n: 0.25, min: 8.5, max: 13 },   // historically slower
  coFrequency:     { t: "add", slope: 0.030, n: 0.30, min: 4.0, max: 9.0 },
  coValue:         { t: "add", slope: 0.020, n: 0.20, min: 2.5, max: 6.0 },
  burnBudget:      { t: "add", slope: -0.05, n: 1.5, min: 84, max: 99 },
  burnProgress:    { t: "add", slope: -0.04, n: 1.5, min: 86, max: 100 },
  backlogMonths:   { t: "add", slope: -0.085, n: 0.30, min: 4.5, max: 11 }, // grew from ~6 to 8.2 over 2 yrs
};

function backcast(key) {
  const cfg = GEN[key];
  const r0 = RECENT[key][0];               // first validated month (Jan '24)
  const hist = [];
  for (let i = 0; i < HIST; i++) {
    const back = HIST - i;                 // months before Jan '24 (19 .. 1)
    let v;
    if (cfg.t === "mul") v = r0 * Math.pow(cfg.g, -back) * jit(cfg.n);
    else v = r0 + cfg.slope * back + jadd(cfg.n);
    if (cfg.min != null) v = Math.max(cfg.min, v);
    if (cfg.max != null) v = Math.min(cfg.max, v);
    hist.push(cfg.int ? Math.round(v) : +v.toFixed(3));
  }
  return hist;
}

const BASELINE = Object.fromEntries(
  Object.keys(RECENT).map((k) => [k, [...backcast(k), ...RECENT[k]]])
);

/* ------------------------------------------------------------------ */
/*  DISCIPLINE DRILL-DOWN                                               */
/*  "All Disciplines" is the blended roll-up. Each discipline is a      */
/*  real slice: additive inputs split by share (shares sum to 1.0, so   */
/*  the three reconstruct the baseline totals exactly); rate inputs get */
/*  small per-discipline offsets so profiles differ modestly.           */
/* ------------------------------------------------------------------ */

const DISCIPLINE_NAMES = ["All Disciplines", "Electrical", "Mechanical", "Commissioning"];

// Additive shares (sum = 1.000). Electrical-led firm with a leaner
// commissioning practice — typical for large E&C delivery.
const SHARES = {
  Electrical:    0.40,
  Mechanical:    0.38,
  Commissioning: 0.22,
};

// Per-discipline rate offsets (added to the baseline rate series).
// Small, intentional contrasts: Electrical runs the tightest margins/cycle,
// Mechanical sits mid, Commissioning is higher-margin but more variable.
const RATE_OFFSETS = {
  Electrical:    { cycle: -0.4, coFrequency: -0.3, coValue: -0.2, burnBudget: +1, burnProgress: +1, winBias: +0.04, marginCostFactor: 1.010, backlog: +0.4 },
  Mechanical:    { cycle: +0.5, coFrequency: +0.4, coValue: +0.3, burnBudget: +0, burnProgress: -1, winBias: -0.02, marginCostFactor: 1.000, backlog: -0.4 },
  Commissioning: { cycle: -0.2, coFrequency: -0.2, coValue: +0.1, burnBudget: -1, burnProgress: +0, winBias: -0.03, marginCostFactor: 0.978, backlog: -0.1 },
};

const ADDITIVE = ["billableHours", "availableHours", "netRevenue", "headcount", "directLaborCost", "directCosts", "wonValue", "notWonValue", "retained", "turnover"];
const ADDITIVE_INT = ["headcount", "retained", "turnover"]; // round these
const COUNT_KEYS = ["projectsWon", "proposalsSub"]; // integer counts, split + rounded

function buildDiscipline(name) {
  if (name === "All Disciplines") return JSON.parse(JSON.stringify(BASELINE));
  const sh = SHARES[name];
  const off = RATE_OFFSETS[name];
  const d = {};

  // additive inputs scaled by share
  for (const k of ADDITIVE) {
    d[k] = BASELINE[k].map((v) => {
      const scaled = v * sh;
      return ADDITIVE_INT.includes(k) ? Math.round(scaled) : +scaled.toFixed(3);
    });
  }
  // counts split by share, min 1 so ratios stay sane
  for (const k of COUNT_KEYS) {
    d[k] = BASELINE[k].map((v) => Math.max(1, Math.round(v * sh)));
  }
  // win bias: nudge projectsWon up/down within proposals to vary win rate
  d.projectsWon = d.projectsWon.map((w, i) => {
    const adj = Math.round(w * (1 + off.winBias));
    return Math.max(1, Math.min(adj, d.proposalsSub[i]));
  });
  // margin contrast: scale direct costs slightly (lower factor => higher margin)
  d.directCosts = d.directCosts.map((v) => +(v * off.marginCostFactor).toFixed(3));

  // rate inputs: baseline series + offset, clamped sensibly
  d.cycleTime    = BASELINE.cycleTime.map((v) => +(v + off.cycle).toFixed(2));
  d.coFrequency  = BASELINE.coFrequency.map((v) => +Math.max(0, v + off.coFrequency).toFixed(2));
  d.coValue      = BASELINE.coValue.map((v) => +Math.max(0, v + off.coValue).toFixed(2));
  d.burnBudget   = BASELINE.burnBudget.map((v) => v + off.burnBudget);
  d.burnProgress = BASELINE.burnProgress.map((v) => v + off.burnProgress);
  d.backlogMonths = BASELINE.backlogMonths.map((v) => +Math.max(0, v + off.backlog).toFixed(2));
  return d;
}

// Pre-build all four datasets once.
const DATASETS = Object.fromEntries(DISCIPLINE_NAMES.map((n) => [n, buildDiscipline(n)]));

// Default target bands (editable via sliders).
const DEFAULT_TARGETS = {
  utilization: [70, 80],
  nrpe:        [200, 320],   // $K
  margin:      [25, 45],     // %
  multiplier:  [2.5, 3.5],
  burn:        [0.85, 1.15],
  backlog:     [6, 12],      // months
  winRate:     [35, 60],     // %
  cycleTime:   [0, 10],      // months  (lower is better; upper bound = target ceiling)
  retention:   [90, 100],    // %
};

/* ------------------------------------------------------------------ */
/*  DERIVATIONS                                                         */
/* ------------------------------------------------------------------ */

const sum = (a) => a.reduce((x, y) => x + y, 0);
const avg = (a) => sum(a) / a.length;

function deriveSeries(d) {
  return {
    utilization: d.billableHours.map((h, i) => (h / d.availableHours[i]) * 100),
    nrpe: d.netRevenue.map((r, i) => (r * 1_000_000 / d.headcount[i]) / 1000), // $K, annualized-proxy on monthly run-rate
    margin: d.netRevenue.map((r, i) => ((r - d.directCosts[i]) / r) * 100),
    multiplier: d.netRevenue.map((r, i) => r / d.directLaborCost[i]),
    burn: d.burnBudget.map((b, i) => b / d.burnProgress[i]),
    winRate: d.projectsWon.map((w, i) => (w / d.proposalsSub[i]) * 100),
    cycle: [...d.cycleTime],
    coFreq: [...d.coFrequency],
    coVal: [...d.coValue],
    retention: d.retained.map((r, i) => (r / (r + d.turnover[i])) * 100),
    backlog: [...d.backlogMonths],
  };
}

// Compute all scalar KPIs for an arbitrary month window. Reused for both the
// selected period and the comparison period (period-over-period deltas).
function kpisForRange(d, range) {
  const [lo, hi] = range;
  const idx = MONTHS.map((_, i) => i).filter((i) => i >= lo && i <= hi);
  if (!idx.length) return null;
  const slice = (arr) => idx.map((i) => arr[i]);
  const bh = sum(slice(d.billableHours)), ah = sum(slice(d.availableHours));
  const rev = sum(slice(d.netRevenue)), dc = sum(slice(d.directCosts)), dl = sum(slice(d.directLaborCost));
  const hc = avg(slice(d.headcount));
  const pw = sum(slice(d.projectsWon)), ps = sum(slice(d.proposalsSub));
  const wv = sum(slice(d.wonValue)), nwv = sum(slice(d.notWonValue));
  const ret = slice(d.retained).slice(-1)[0], turn = slice(d.turnover).slice(-1)[0];
  const months = idx.length;
  return {
    revenue: rev,
    grossProfit: rev - dc,
    ebitda: (rev - dc) * 0.611,            // EBITDA proxy held at snapshot ratio (16.8/27.4)
    utilization: (bh / ah) * 100,
    nrpe: (rev / months) * 1_000_000 / hc / 1000,
    margin: ((rev - dc) / rev) * 100,
    multiplier: rev / dl,
    burn: avg(slice(d.burnBudget)) / avg(slice(d.burnProgress)),
    backlog: slice(d.backlogMonths).slice(-1)[0],   // end-of-range stock
    winRate: (pw / ps) * 100,
    cycle: avg(slice(d.cycleTime)),
    coFreq: avg(slice(d.coFrequency)),
    coVal: avg(slice(d.coValue)),
    retention: (ret / (ret + turn)) * 100,
    wonValue: wv, notWonValue: nwv, retained: ret, turnover: turn, months, idx,
  };
}

// Roll up the selected range and attach the monthly chart series.
function rollup(d, s, range) {
  const k = kpisForRange(d, range);
  const slice = (arr) => k.idx.map((i) => arr[i]);
  return {
    ...k,
    series: {
      utilization: slice(s.utilization),
      nrpe: slice(s.nrpe),
      margin: slice(s.margin),
      multiplier: slice(s.multiplier),
      burn: slice(s.burn),
      winRate: slice(s.winRate),
      cycle: slice(s.cycle),
      coFreq: slice(s.coFreq),
      coVal: slice(s.coVal),
      retention: slice(s.retention),
      backlog: slice(s.backlog),
      labels: k.idx.map((i) => MONTHS[i]),
    },
  };
}

// --- Reporting-period presets (executive date control) ---------------------
// Trailing windows over the 24-month span; "now" = the most recent month.
const N_MONTHS = MONTHS.length, LAST_M = N_MONTHS - 1;
const trailing = (len) => [Math.max(0, LAST_M - len + 1), LAST_M];
const priorTrailing = (len) => (LAST_M - 2 * len + 1 >= 0 ? [LAST_M - 2 * len + 1, LAST_M - len] : null);

const PRESETS = [
  { id: "YTD",  label: "YTD",        range: [YTD_START, LAST_M], compareRange: [YTD_START - 12, LAST_M - 12], compareLabel: "vs prior YTD" },
  { id: "Q",    label: "Last Qtr",   range: trailing(3),         compareRange: priorTrailing(3),              compareLabel: "vs prior qtr" },
  { id: "6M",   label: "Last 6 Mo",  range: trailing(6),         compareRange: priorTrailing(6),              compareLabel: "vs prior 6 mo" },
  { id: "12M",  label: "Last 12 Mo", range: trailing(12),        compareRange: priorTrailing(12),             compareLabel: "vs prior year" },
  { id: "2Y",   label: "2 Years",    range: [0, LAST_M],         compareRange: null,                          compareLabel: "full 2-yr span" },
];
// Custom range compares to the immediately preceding equal-length window (if it fits).
const customCompare = (range) => { const len = range[1] - range[0] + 1; const lo = range[0] - len; return lo >= 0 ? [lo, range[0] - 1] : null; };

/* Backlog now has a full monthly series (backlogMonths). The rolled-up value  */
/* is the end-of-range stock; the latest month is editable via the what-if.    */

const META = [

function Dropdown({ label, value, options, onChange }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ position: "relative", minWidth: 150 }}>
      <div style={{ fontSize: 10, letterSpacing: 1, color: C.faint, textTransform: "uppercase", marginBottom: 5 }}>{label}</div>

function statusOf(m, val, targets, extraBacklog) {
  if (m.id === "co") return "neutral";
  if (m.id === "burn") {
    const [lo, hi] = targets.burn;
    return val >= lo && val <= hi ? "on" : "off";
  }
  const t = targets[m.target];
  if (!t) return "neutral";
  const [lo, hi] = t;
  if (m.higher) return val >= lo ? "on" : "off";
  // lower-is-better (cycle time)
  return val <= hi ? "on" : "off";
}

// Compute the period-over-period delta for a metric against the comparison
// period value. Returns { text, up } where `up` means a favorable move.
function deltaVsPrior(m, val, prior) {
  if (prior == null) return null;
  const diff = val - prior;
  const favorable = m.higher ? diff >= 0 : diff <= 0;
  let text;
  if (m.unit === "%") text = `${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff).toFixed(1)}pp`;
  else if (m.unit === "$K") { const p = (diff / prior) * 100; text = `${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toFixed(0)}%`; }
  else if (m.unit === "x") text = `${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff).toFixed(1)}x`;
  else if (m.unit === "mo") text = `${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff).toFixed(1)} mo`;
  else text = `${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff).toFixed(2)}`;
  return { text, up: favorable };
}

// Percentage period-over-period delta for financial totals (higher = better).
const pctDelta = (cur, prev) => (prev ? { text: `${cur >= prev ? "▲" : "▼"} ${Math.abs((cur - prev) / prev * 100).toFixed(0)}%`, up: cur >= prev } : null);

  const [expanded, setExpanded] = useState(null);

  // Editable "latest-month" inputs, seeded from the active discipline.
  const [inputs, setInputs] = useState(() => seedInputs("All Disciplines"));

  // When the discipline changes, reseed the editable inputs to that slice.
  useEffect(() => { setInputs(seedInputs(discipline)); }, [discipline]);

  // Build a working dataset from the active discipline, with the last month
  // overridden by the (possibly edited) inputs.
  const workingData = useMemo(() => {
    const d = JSON.parse(JSON.stringify(DATASETS[discipline]));
    const last = MONTHS.length - 1;
    d.billableHours[last] = +inputs.billableHours;
    d.availableHours[last] = +inputs.availableHours;
    d.netRevenue[last] = +inputs.netRevenue;
    d.headcount[last] = +inputs.headcount;
    d.directCosts[last] = +inputs.directCosts;
    d.directLaborCost[last] = +inputs.directLaborCost;
    d.projectsWon[last] = +inputs.projectsWon;
    d.proposalsSub[last] = +inputs.proposalsSub;
    d.retained[last] = +inputs.retained;
    d.turnover[last] = +inputs.turnover;
    d.backlogMonths[last] = +inputs.backlog;
    return d;
  }, [inputs, discipline]);

  const series = useMemo(() => deriveSeries(workingData), [workingData]);
  const data = useMemo(() => rollup(workingData, series, range), [workingData, series, range]);

  // Comparison period drives period-over-period deltas. Presets carry an
  // explicit comparison; custom ranges compare to the preceding equal window.
  const compareRange = useMemo(() => {
    if (preset === "Custom") return customCompare(range);
    const p = PRESETS.find((x) => x.id === preset);
    return p ? p.compareRange : null;
  }, [preset, range]);
  const compareLabel = preset === "Custom" ? "vs prior period" : (PRESETS.find((x) => x.id === preset)?.compareLabel || "");
  const compare = useMemo(() => (compareRange ? kpisForRange(workingData, compareRange) : null), [workingData, compareRange]);

  const onTarget = useCallback((k, b) => setTargets((t) => ({ ...t, [k]: b })), []);
  const onInput = useCallback((k, v) => setInputs((s) => ({ ...s, [k]: v === "" ? 0 : v })), []);

  const applyPreset = (p) => { setPreset(p.id); setRange(p.range); setShowCustom(false); };
  const openCustom = () => { setPreset("Custom"); setShowCustom(true); };

  const reset = () => {
    setTargets(DEFAULT_TARGETS);
    setPreset("YTD");
    setRange(PRESETS[0].range);
    setShowCustom(false);
    setDiscipline("All Disciplines");
    setExpanded(null);
    setInputs(seedInputs("All Disciplines"));
  };

  // on-target tally
  const onTargetCount = META.filter((m) => statusOf(m, m.id === "co" ? data.coFreq : data[m.id], targets) === "on").length;
  const targetable = META.filter((m) => m.id !== "co").length;

  // data-confidence rating from coverage of targets
  const conf = onTargetCount >= 8 ? { label: "High", color: C.green }
    : onTargetCount >= 5 ? { label: "Moderate", color: C.amber }
    : { label: "Low", color: C.red };

  // dynamic key takeaway: name the metrics that are off-target
  const offTarget = META.filter((m) => m.id !== "co" && statusOf(m, data[m.id], targets) === "off").map((m) => m.title);
  const takeaway = offTarget.length === 0
    ? `All ${targetable} measured metrics are on or above target — broad-based strength across the portfolio.`
    : `${onTargetCount} of ${targetable} metrics on or above target. Watch: ${offTarget.slice(0, 3).join(", ")}${offTarget.length > 3 ? ", and others" : ""}.`;

  // contextual sub-metrics for the financial tiles
  const grossMarginPct = data.margin;
  const ebitdaMarginPct = (data.ebitda / data.revenue) * 100;
  const avgMonthlyRev = data.revenue / data.months;

  const fmt$ = (m) => "$" + m.toFixed(1) + "M";

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, fontFamily: "'Inter', -apple-system, system-ui, sans-serif", padding: 22 }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
        input[type=range]{height:4px;border-radius:4px;background:${C.line};outline:none;-webkit-appearance:none;}
        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:${C.blue};cursor:pointer;border:2px solid ${C.bg};}
        input[type=number]{outline:none;} input[type=number]:focus{border-color:${C.blue};}
        *{box-sizing:border-box;} ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:${C.line};border-radius:8px;}`}
      </style>

      {/* ---- HEADER ---- */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 14 }}>
        <div>
          <h1 style={{ fontSize: 25, fontWeight: 800, margin: 0, letterSpacing: -.5 }}>
            Resolut Group <span style={{ color: C.blue }}>OpEx Executive Review</span><span style={{ color: C.faint, fontWeight: 600, fontSize: 21 }}> — Sample</span>
          </h1>
          <div style={{ fontSize: 13, color: C.blue, fontWeight: 600, marginTop: 2 }}>Top 10 Metrics Driving Performance, Profitability & Growth</div>
          <div style={{ fontSize: 11.5, color: C.faint, marginTop: 2 }}>Real-time insights. Trusted data. Confident decisions.</div>
          <div style={{ display: "inline-flex", alignItems: "center", gap: 7, marginTop: 8, background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 20, padding: "4px 12px" }}>
            <span style={{ width: 7, height: 7, borderRadius: "50%", background: C.brass }} />
            <span style={{ fontSize: 11, color: C.sub, fontWeight: 600 }}>
              Viewing: <span style={{ color: C.brassLt }}>{discipline}</span>
              {discipline !== "All Disciplines" && <span style={{ color: C.faint, fontWeight: 400 }}> · {(SHARES[discipline] * 100).toFixed(0)}% of firm volume</span>}
            </span>
          </div>
        </div>
        <button onClick={reset}
          style={{ display: "flex", alignItems: "center", gap: 7, background: C.panel, border: `1px solid ${C.line}`, color: C.sub, borderRadius: 9, padding: "9px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
          <RotateCcw size={14} /> Reset to baseline
        </button>
      </div>

      {/* ---- FINANCIAL IMPACT BAND ---- */}
      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, marginBottom: 14, overflow: "hidden" }}>
        {/* header: title · comparison · data confidence */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "11px 20px", borderBottom: `1px solid ${C.line}`, flexWrap: "wrap", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 11 }}>
            <span style={{ fontSize: 12, letterSpacing: 1.5, color: C.text, textTransform: "uppercase", fontWeight: 700 }}>Financial Impact</span>
            <span style={{ fontSize: 11, color: C.brassLt, fontWeight: 600 }}>{compare ? compareLabel : "selected period"}</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <ShieldCheck size={15} style={{ color: conf.color }} />
            <span style={{ fontSize: 10, color: C.faint, textTransform: "uppercase", letterSpacing: .8 }}>Data Confidence</span>
            <span style={{ fontSize: 12.5, fontWeight: 700, color: conf.color }}>{conf.label}</span>
          </div>
        </div>
        {/* three equal financial tiles */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", borderBottom: `1px solid ${C.line}` }}>
          <FinTile icon={DollarSign} label="Revenue" value={fmt$(data.revenue)} delta={pctDelta(data.revenue, compare?.revenue)} sub={`${fmt$(avgMonthlyRev)}/mo average`} color={C.brass} />
          <FinTile icon={TrendingUp} label="Gross Profit" value={fmt$(data.grossProfit)} delta={pctDelta(data.grossProfit, compare?.grossProfit)} sub={`${grossMarginPct.toFixed(1)}% gross margin`} color={C.brassLt} />
          <FinTile icon={Activity} label="EBITDA" value={fmt$(data.ebitda)} delta={pctDelta(data.ebitda, compare?.ebitda)} sub={`${ebitdaMarginPct.toFixed(1)}% EBITDA margin`} color={C.slate} last />
        </div>
        {/* key takeaway strip */}
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 20px" }}>
          <Star size={14} style={{ color: C.brass, flexShrink: 0 }} fill={C.brass} />
          <span style={{ fontSize: 9.5, letterSpacing: .9, color: C.faint, textTransform: "uppercase", fontWeight: 700, flexShrink: 0 }}>Key Takeaway</span>
          <span style={{ fontSize: 12, color: C.sub, lineHeight: 1.35 }}>{takeaway}</span>
        </div>
      </div>

      {/* ---- FILTER BAR ---- */}
      <div style={{ display: "flex", gap: 18, alignItems: "flex-start", background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 18px", marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 460px", minWidth: 420 }}>
          <div style={{ fontSize: 10, letterSpacing: 1, color: C.faint, textTransform: "uppercase", marginBottom: 7 }}>Reporting Period</div>
          <div style={{ display: "flex", gap: 7, flexWrap: "wrap", alignItems: "center" }}>
            {PRESETS.map((p) => {
              const active = preset === p.id;
              return (
                <button key={p.id} onClick={() => applyPreset(p)}
                  style={{
                    background: active ? C.brass : C.panel2, color: active ? "#1a1407" : C.sub,
                    border: `1px solid ${active ? C.brass : C.line}`, borderRadius: 8,
                    padding: "7px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer", transition: ".15s",
                    letterSpacing: .2,
                  }}>
                  {p.label}
                </button>
              );
            })}
            <button onClick={openCustom}
              style={{
                background: preset === "Custom" ? C.brass : C.panel2, color: preset === "Custom" ? "#1a1407" : C.sub,
                border: `1px solid ${preset === "Custom" ? C.brass : C.line}`, borderRadius: 8,
                padding: "7px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 5,
              }}>
              <SlidersHorizontal size={12} /> Custom
            </button>
          </div>
          <div style={{ fontSize: 11, color: C.sub, marginTop: 8, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{MONTHS[range[0]]} – {MONTHS[range[1]]}</span>
            <span style={{ color: C.faint }}>· {range[1] - range[0] + 1} mo</span>
            {compare
              ? <span style={{ color: C.faint }}>· compared to {MONTHS[compareRange[0]]}–{MONTHS[compareRange[1]]} ({compareLabel})</span>
              : <span style={{ color: C.faint }}>· no prior period to compare (full span)</span>}
          </div>
          {showCustom && (
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.line}` }}>
              <div style={{ display: "flex", gap: 10 }}>
                <input type="range" min={0} max={MONTHS.length - 1} value={range[0]}
                  onChange={(e) => { setPreset("Custom"); setRange([Math.min(+e.target.value, range[1]), range[1]]); }} style={{ flex: 1 }} />
                <input type="range" min={0} max={MONTHS.length - 1} value={range[1]}
                  onChange={(e) => { setPreset("Custom"); setRange([range[0], Math.max(+e.target.value, range[0])]); }} style={{ flex: 1 }} />
              </div>
              <div style={{ fontSize: 9.5, color: C.faint, marginTop: 4 }}>Drag either handle. Comparison auto-tracks the preceding equal-length window.</div>
            </div>
          )}
        </div>
        <Dropdown label="Discipline" value={discipline} onChange={setDiscipline}
          options={DISCIPLINE_NAMES} />
        <div style={{ fontSize: 10.5, color: C.faint, paddingTop: 18, fontStyle: "italic", maxWidth: 180 }}>
          Click the ✎ on any card to run a what-if and edit targets.
        </div>
      </div>

      {/* ---- METRIC GRID ---- */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 14 }}>
        {META.map((m) => (
          <MetricCard key={m.id} m={m} data={data} targets={targets} onTarget={onTarget}
            inputs={inputs} onInput={onInput} compare={compare} compareLabel={compareLabel}
            expanded={expanded === m.id} onExpand={() => setExpanded(expanded === m.id ? null : m.id)} />
        ))}
      </div>

      {/* ---- SUMMARY BAND ---- */}
      <SummaryBand data={data} targets={targets} />

      {/* ---- FOOTER ---- */}
      <div style={{ textAlign: "center", marginTop: 18, padding: "12px", fontSize: 12, color: C.faint, borderTop: `1px solid ${C.line}` }}>
        One set of metrics. One source of truth. Aligned teams. Better decisions.
        <span style={{ marginLeft: 14, color: C.faint, opacity: .7 }}>· Interactive prototype — seeded values, edits are session-only.</span>
      </div>
    </div>
  );
}

// ---- mount ----
const __root = document.getElementById("root");
__root.innerHTML = "";
createRoot(__root).render(<Dashboard />);

  </script>

  <!-- If libraries fail to load within 12s, surface a friendly message -->
  <script>
    setTimeout(function () {
      var boot = document.getElementById("boot");
      if (boot) { var f = document.getElementById("fail"); if (f) f.style.display = "block"; }
    }, 12000);
  </script>
</body>
</html>
